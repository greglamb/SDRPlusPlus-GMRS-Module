# On-demand build of SDR++ (Apple Silicon) with the FRS/GMRS Monitor module
# baked in. Run it from the Actions tab ("Run workflow"); download SDR++.app
# from the run's artifacts.
#
# The app is unsigned: after unzipping, run
#   xattr -dr com.apple.quarantine SDR++.app
# once, or right-click → Open the first time.
#
# Releases: fill in "release_tag" when running it manually (e.g. v0.2.0), or
# push a tag matching v* — either way the zip is attached to a GitHub release
# of that tag with generated notes. Leave release_tag empty for a plain build
# whose zip is only a run artifact.
name: Build macOS (Apple Silicon)

on:
  workflow_dispatch:
    inputs:
      sdrpp_ref:
        description: "SDR++ git ref to build against (branch, tag or commit)"
        required: true
        default: master
      build_type:
        description: "CMake build type"
        required: true
        default: Release
        type: choice
        options: [Release, RelWithDebInfo, Debug]
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v0.2.0); empty = artifact only"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write   # to create the release

jobs:
  build:
    runs-on: macos-15   # arm64 runner
    timeout-minutes: 90
    env:
      SDRPP_REF: ${{ inputs.sdrpp_ref || 'master' }}
      BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

    steps:
      - name: Check out this module
        uses: actions/checkout@v4
        with:
          path: module

      - name: Check out SDR++
        uses: actions/checkout@v4
        with:
          repository: AlexandreRouma/SDRPlusPlus
          ref: ${{ env.SDRPP_REF }}
          path: sdrpp

      - name: Install dependencies (Homebrew)
        run: |
          brew update
          brew install pkg-config libusb fftw glfw volk zstd portaudio \
                       librtlsdr airspy airspyhf hackrf

      - name: Wire the module into the SDR++ tree
        run: sh "$GITHUB_WORKSPACE/module/tools/install_in_tree.sh" "$GITHUB_WORKSPACE/sdrpp" --copy

      # One-line patch to SDR++'s built-in default config so a fresh install
      # already has the module enabled (an existing config.json is left alone,
      # as SDR++ only applies defaults to missing top-level keys).
      - name: Enable the module in SDR++'s default config
        run: |
          f=sdrpp/core/src/core.cpp
          grep -q 'defConfig\["moduleInstances"\]\["Radio"\] = "radio";' "$f"
          perl -0pi -e 's/(defConfig\["moduleInstances"\]\["Radio"\] = "radio";)/$1\n    defConfig["moduleInstances"]["FRS\/GMRS Monitor"] = "frsgmrs_monitor";/' "$f"
          grep -n 'frsgmrs_monitor' "$f"

      - name: Configure
        run: |
          cmake -S sdrpp -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DUSE_BUNDLE_DEFAULTS=ON \
            -DOPT_BUILD_FRSGMRS_MONITOR=ON \
            -DOPT_BUILD_RTL_SDR_SOURCE=ON \
            -DOPT_BUILD_AIRSPY_SOURCE=ON \
            -DOPT_BUILD_AIRSPYHF_SOURCE=ON \
            -DOPT_BUILD_HACKRF_SOURCE=ON \
            -DOPT_BUILD_FILE_SOURCE=ON \
            -DOPT_BUILD_AUDIO_SINK=OFF \
            -DOPT_BUILD_PORTAUDIO_SINK=ON \
            -DOPT_BUILD_NEW_PORTAUDIO_SINK=ON \
            -DOPT_BUILD_AUDIO_SOURCE=OFF \
            -DOPT_BUILD_PLUTOSDR_SOURCE=OFF \
            -DOPT_BUILD_M17_DECODER=OFF

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Check the module linked
        run: |
          ls -l build/decoder_modules/frsgmrs_monitor/frsgmrs_monitor.dylib
          file build/decoder_modules/frsgmrs_monitor/frsgmrs_monitor.dylib

      - name: Make the .app bundle
        working-directory: sdrpp
        run: |
          sh make_macos_bundle.sh "$GITHUB_WORKSPACE/build" ./SDR++.app
          ls SDR++.app/Contents/Plugins | grep -q frsgmrs_monitor
          SDRPP_SHA=$(git rev-parse --short HEAD)
          SDRPP_VER=$(sed -n 's/#define VERSION_STR "\(.*\)"/\1/p' core/src/version.h)
          SDRPP_DATE=$(git log -1 --format=%cs)
          MOD_SHA=$(git -C "$GITHUB_WORKSPACE/module" rev-parse --short HEAD)
          ZIP="SDRpp-${SDRPP_VER}-${SDRPP_SHA}-GMRS-${MOD_SHA}-macos-arm64.zip"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SDRPP_SHA=$SDRPP_SHA" >> "$GITHUB_ENV"
          echo "SDRPP_VER=$SDRPP_VER" >> "$GITHUB_ENV"
          echo "SDRPP_DATE=$SDRPP_DATE" >> "$GITHUB_ENV"
          echo "SDRPP_LONG_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          ditto -c -k --keepParent SDR++.app "$GITHUB_WORKSPACE/$ZIP" 2>/dev/null || zip -qry "$GITHUB_WORKSPACE/$ZIP" SDR++.app

      - name: Upload SDR++.app
        uses: actions/upload-artifact@v4
        with:
          name: SDR++-macos-arm64
          path: ${{ env.ZIP }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: env.RELEASE_TAG != ''
        working-directory: module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          SDR++ (Apple Silicon) with the FRS/GMRS Monitor module built in.

          **Bundled SDR++: ${SDRPP_VER}**, master commit [\`${SDRPP_SHA}\`](https://github.com/AlexandreRouma/SDRPlusPlus/commit/${SDRPP_LONG_SHA}) of ${SDRPP_DATE} (ref \`${SDRPP_REF}\`, ${BUILD_TYPE} build; the only change is one line in the default config enabling this module)

          - Module: \`$(git rev-parse --short HEAD)\`
          - Sources: RTL-SDR, Airspy, Airspy HF+, HackRF, File · Sink: PortAudio

          **Install:** unzip, move \`SDR++.app\` to Applications, then once:
          \`\`\`
          xattr -dr com.apple.quarantine /Applications/SDR++.app
          \`\`\`
          *FRS/GMRS Monitor* is enabled out of the box on a fresh SDR++ config. If you already had SDR++ configured, add it once in *Module Manager* → \`frsgmrs_monitor\`.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE/$ZIP" --clobber
          else
            gh release create "$RELEASE_TAG" "$GITHUB_WORKSPACE/$ZIP" \
              --title "FRS/GMRS Monitor $RELEASE_TAG — SDR++ ${SDRPP_VER} (${SDRPP_SHA}, ${SDRPP_DATE})" \
              --notes-file notes.md --generate-notes
          fi
